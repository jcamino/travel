<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jcamino · travel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0a4f66 0%, #0e6e8c 70%, #12809f 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 1.5rem;
  }
  .wrap { max-width: 26rem; width: 100%; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 1.4rem; letter-spacing: .02em; }
  a.card {
    display: block;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    padding: 1.2rem 1.4rem;
    color: #fff;
    text-decoration: none;
    text-align: left;
    transition: background .15s ease;
  }
  a.card:hover { background: rgba(255,255,255,.18); }
  a.card strong { display: block; font-size: 1.1rem; margin-bottom: .25rem; }
  a.card span { font-size: .88rem; opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Travel guides</h1>
  <a class="card" href="/trasvia/">
    <strong>Trasvía · Comillas, Cantabria</strong>
    <span>Guest guide for 13–16 August 2026 — monuments, tours, beaches, tides &amp; day trips</span>
  </a>
</div>
</body>
</html>
